<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Johana est trop belle</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💋</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(circle at 50% 40%, #ffe3ec 0%, #ffc2d4 55%, #ff9ebb 100%);
    font-family: 'Quicksand', sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
    color: #b0124a; text-align: center; padding: 20px;
  }
  .kiss {
    width: min(60vw, 320px);
    transform: scale(0) rotate(-20deg);
    animation: pop 0.9s cubic-bezier(.2,1.6,.4,1) 0.3s forwards, pulse 1.6s ease-in-out 1.4s infinite;
    filter: drop-shadow(0 10px 25px rgba(176,18,74,.35));
  }
  @keyframes pop { to { transform: scale(1) rotate(-8deg); } }
  @keyframes pulse {
    0%,100% { transform: scale(1) rotate(-8deg); }
    50% { transform: scale(1.08) rotate(-8deg); }
  }
  .mwah {
    font-family: 'Dancing Script', cursive; font-weight: 700;
    font-size: clamp(2.4rem, 9vw, 4.5rem); margin-top: 18px;
    opacity: 0; animation: fadeUp .8s ease 1.1s forwards;
  }
  .sub {
    font-size: clamp(1rem, 4vw, 1.3rem); margin-top: 6px;
    opacity: 0; animation: fadeUp .8s ease 1.6s forwards;
  }
  .hint { position: fixed; bottom: 22px; font-size: .9rem; opacity: 0; animation: fadeUp .8s ease 2.6s forwards; color: #c2185b; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: none; } }
  .float {
    position: fixed; pointer-events: none; font-size: 28px;
    animation: rise linear forwards;
  }
  @keyframes rise {
    0% { transform: translateY(0) scale(.6); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translateY(-110vh) scale(1.2) rotate(25deg); opacity: 0; }
  }
  .burst {
    position: fixed; pointer-events: none; font-size: 46px;
    transform: translate(-50%, -50%) scale(0);
    animation: burst 1.2s ease-out forwards;
  }
  @keyframes burst {
    0% { transform: translate(-50%,-50%) scale(0) rotate(-20deg); opacity: 1; }
    40% { transform: translate(-50%,-50%) scale(1.3) rotate(-8deg); opacity: 1; }
    100% { transform: translate(-50%,-90%) scale(1) rotate(-8deg); opacity: 0; }
  }
</style>
</head>
<body>
  <svg class="kiss" viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg" aria-label="Un bisou">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ff3d7f"/>
        <stop offset="1" stop-color="#c2003f"/>
      </linearGradient>
    </defs>
    <!-- lèvre du haut -->
    <path d="M10 62 C 30 30, 60 14, 82 26 C 92 32, 96 36, 100 42 C 104 36, 108 32, 118 26 C 140 14, 170 30, 190 62 C 160 58, 130 60, 100 64 C 70 60, 40 58, 10 62 Z" fill="url(#g)"/>
    <!-- lèvre du bas -->
    <path d="M10 66 C 40 64, 70 66, 100 70 C 130 66, 160 64, 190 66 C 170 104, 135 120, 100 120 C 65 120, 30 104, 10 66 Z" fill="url(#g)"/>
    <!-- reflets -->
    <path d="M55 34 C 65 28, 75 28, 82 33" stroke="#ffd1e0" stroke-width="5" stroke-linecap="round" fill="none" opacity=".7"/>
    <path d="M70 96 C 85 104, 115 104, 130 96" stroke="#ffd1e0" stroke-width="6" stroke-linecap="round" fill="none" opacity=".55"/>
  </svg>
  <div class="mwah">Mwah !</div>
  <div class="sub">Parce que Johana est trop belle 💕</div>
  <div class="hint">Touche l'écran pour plus de bisous</div>

<script>
  const hearts = ['💕','💖','💗','❤️','💘','💋'];
  function floatHeart() {
    const h = document.createElement('div');
    h.className = 'float';
    h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.bottom = '-40px';
    h.style.fontSize = (18 + Math.random() * 26) + 'px';
    h.style.animationDuration = (5 + Math.random() * 5) + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 11000);
  }
  for (let i = 0; i < 12; i++) setTimeout(floatHeart, i * 150);
  setInterval(floatHeart, 450);

  document.addEventListener('click', e => {
    const k = document.createElement('div');
    k.className = 'burst';
    k.textContent = '💋';
    k.style.left = e.clientX + 'px';
    k.style.top = e.clientY + 'px';
    document.body.appendChild(k);
    setTimeout(() => k.remove(), 1300);
  });
</script>
</body>
</html>
